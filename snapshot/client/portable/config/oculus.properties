#Esta distribucion va a equipos con grafica integrada (Iris Xe).
#Los shaders quedan APAGADOS a proposito: con ellos encendidos, Oculus 1.8.0 se
#cuelga creando el pipeline y el juego nunca llega a abrir ventana. Ocurre con el
#proceso vivo y quemando CPU, sin mensaje de error y sin crash report, asi que
#desde fuera parece que "no abre". Se vio en el equipo de Isa el 25 y el 26 de
#julio de 2026: el registro se congela en "Creating pipeline for dimension
#overworld" seguido de "Type is VERTEX / GEOMETRY / FRAGMENT" y ahi se queda.
#Se deja Shrimple escrito, que es el ligero y el unico parcheado para Oculus
#1.8.0, por si alguien quiere probar a encenderlos a mano desde el juego.
colorSpace=SRGB
disableUpdateMessage=false
enableDebugOptions=false
maxShadowRenderDistance=16
shaderPack=Shrimple_v0.12.zip
enableShaders=false
