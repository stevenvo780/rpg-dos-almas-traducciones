plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    flatDir {
        dirs file(findProperty('localModsDir') ?: '../../Servidor/RPG-Dos-Almas/mods')
    }
}

def localModsDirectory = file(findProperty('localModsDir') ?: '../../Servidor/RPG-Dos-Almas/mods')
def requiredModJar = { String fragment ->
    def matches = fileTree(localModsDirectory)
        .matching { include '*.jar' }
        .files
        .findAll { it.name.toLowerCase(Locale.ROOT).contains(fragment.toLowerCase(Locale.ROOT)) }
    if (matches.size() != 1) {
        throw new GradleException(
            "Se esperaba exactamente un JAR con '${fragment}' en ${localModsDirectory}; encontrados: ${matches*.name}"
        )
    }
    matches.first()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf(files(requiredModJar('sophisticatedcore')))
    compileOnly fg.deobf(files(requiredModJar('sophisticatedbackpacks')))
    compileOnly fg.deobf(files(requiredModJar('thirstwastaken')))
    compileOnly fg.deobf(files(requiredModJar('curios-forge')))
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Stev',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Stev'
        ])
    }
    finalizedBy 'reobfJar'
}
